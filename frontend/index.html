<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serverless URL Shortener</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-4">🔗 Serverless URL Shortener</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <label for="longUrl" class="form-label">Long URL</label>
        <input id="longUrl" class="form-control" type="text" placeholder="https://example.com/very/long/url" />

        <button id="shortenBtn" class="btn btn-primary mt-3 w-100" onclick="createSlug()">
          Shorten URL
        </button>

        <div id="spinner" class="text-center mt-3 d-none">
          <div class="spinner-border text-primary" role="status"></div>
        </div>

        <div id="result" class="alert alert-success mt-3 d-none"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "__API_BASE_URL__";

    async function createSlug() {
      const input = document.getElementById('longUrl');
      const url = input.value.trim();
      if (!url) return alert('Please enter a URL');

      document.getElementById('spinner').classList.remove('d-none');
      document.getElementById('result').classList.add('d-none');

      try {
        const res = await fetch(`${API_BASE}/api/slug`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        const shortUrl = data.short_url;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `Short URL: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
        resultDiv.classList.remove('d-none');
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        document.getElementById('spinner').classList.add('d-none');
      }
    }
  </script>
</body>
</html>
