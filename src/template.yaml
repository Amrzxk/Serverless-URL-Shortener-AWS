AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# ─────────────────────
# Parameters
# ─────────────────────
Parameters:
  AlertEmail:
    Type: String
    Description: Email address to receive cost and error alerts
    Default: amrzakariya2018@gmail.com

# ─────────────────────
# Globals (optional, keeps each function shorter)
# ─────────────────────
Globals:
  Function:
    Runtime: python3.13
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref UrlTable

Resources:
  # 🚨 Cost Monitoring & Alerts
  CostAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-cost-alerts"
      DisplayName: "URL Shortener Cost Alerts"

  CostAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref CostAlertsTopic
      Endpoint: !Ref AlertEmail  # We'll add this parameter

  # AWS Budget (first 2 budgets are free)
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-budget"
        BudgetLimit:
          Amount: 5.00  # Alert if costs exceed $5/month
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100  # Alert when total costs exceed $5
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic

  # CloudWatch Alarms (10 custom metrics free)
  CreateSlugErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-CreateSlug-Errors"
      AlarmDescription: "Alert when CreateSlug function has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1  # Alert on any error
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateSlugFunction
      AlarmActions:
        - !Ref CostAlertsTopic

  RedirectErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-Redirect-Errors"
      AlarmDescription: "Alert when Redirect function has errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref RedirectFunction
      AlarmActions:
        - !Ref CostAlertsTopic

  ApiGateway5XXAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-API-5XX-Errors"
      AlarmDescription: "Alert when API has 5XX error rate > 1%"
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2  # Must breach for 10 minutes
      Threshold: 5  # Alert if 5+ errors in 5 minutes (roughly 1% for moderate traffic)
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref HttpApi
      AlarmActions:
        - !Ref CostAlertsTopic

  # 1️⃣ DynamoDB table  (PK = slug, string)
  UrlTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: slug
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
    
  # API Gateway (HTTP API - cheaper than REST)
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: UrlShortenerApi
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["*"]
  # Create Lambda Function (POST /api/slug)
  CreateSlugFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create_slug/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlTable
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/slug
            Method: POST
            PayloadFormatVersion: '2.0'
  # Redirect Lambda Function (GET /{slug})
  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: redirect/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{slug}
            Method: GET
            PayloadFormatVersion: '2.0'

  # Static website bucket
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${SiteBucket.Arn}/*"

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'

  SiteURL:
    Description: CloudFront distribution URL
    Value: !GetAtt SiteDistribution.DomainName

  SiteBucketName:
    Description: Name of S3 bucket hosting the static site
    Value: !Ref SiteBucket

  CostAlertsTopic:
    Description: SNS Topic for cost and error alerts
    Value: !Ref CostAlertsTopic
    
  BudgetName:
    Description: AWS Budget monitoring monthly costs
    Value: !Sub "${AWS::StackName}-monthly-budget"

  SiteDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref SiteDistribution