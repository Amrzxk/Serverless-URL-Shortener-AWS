name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci-check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.x'

      - name: Install test dependencies
        run: pip install --quiet pytest

      - name: Install SAM CLI
        run: pip install --no-cache-dir aws-sam-cli

      - name: Install project dependencies (requirements.txt if present)
        run: |
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: Build with SAM
        working-directory: src
        run: sam build --cached

      - name: Run unit tests
        working-directory: src
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
        run: python -m pytest --quiet tests/unit

      - name: Validate SAM template
        working-directory: src
        run: sam validate

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: ci-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # Required for OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.x'

      - name: Install SAM CLI
        run: pip install --no-cache-dir aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build with SAM
        working-directory: src
        run: sam build --cached

      - name: Deploy to AWS
        working-directory: src
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --region ${{ secrets.AWS_REGION }} --config-env pipeline

      - name: Get API URL
        working-directory: src
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name url-shortener-dev --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          SITE_BUCKET=$(aws cloudformation describe-stacks --stack-name url-shortener-dev --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "SITE_BUCKET=$SITE_BUCKET" >> $GITHUB_ENV

      - name: Prepare frontend
        run: |
          sed -i "s|__API_BASE_URL__|$API_URL|g" frontend/index.html

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://$SITE_BUCKET --delete

      - name: Invalidate CloudFront cache
        if: env.SITE_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id $SITE_DIST_ID --paths "/*"